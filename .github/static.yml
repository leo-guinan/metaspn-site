# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build blog from Sanity
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET || 'production' }}
        run: |
          if [ -z "$SANITY_PROJECT_ID" ]; then
            echo "⚠️  SANITY_PROJECT_ID not set - skipping blog build"
            echo "   Set it as a GitHub Secret to enable automated blog builds"
          else
            npm run build:blog
          fi
      
      - name: Build Sanity Studio
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET || 'production' }}
        run: |
          if [ -z "$SANITY_PROJECT_ID" ]; then
            echo "⚠️  SANITY_PROJECT_ID not set - skipping studio build"
          else
            npm run build:studio || echo "⚠️  Studio build failed (may need additional setup)"
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Copy studio to root (if built)
        run: |
          if [ -d "studio-dist" ]; then
            echo "📁 Copying studio files..."
            cp -r studio-dist/* . || true
            # Create studio directory structure for GitHub Pages
            mkdir -p studio
            cp -r studio-dist/* studio/ || true
          fi
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository (includes studio if built)
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
